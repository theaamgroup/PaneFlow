# cargo-deny configuration.
#
# Graduated-severity posture (Bevy pattern). The CI `security_audit`
# job is BLOCKING and required via `tests_pass` - false positives are
# absorbed inside this file, not via `continue-on-error` on the job.
#
#   * advisories.vulnerabilities → deny (cargo-deny 0.19 default)
#   * advisories.unmaintained    → workspace-scoped warn
#   * advisories.yanked          → warn
#   * advisories.ignore = [...]  → explicit per-advisory list with
#                                  rationale + re-evaluation triggers
#   * unused-ignored-advisory    → warn (surface stale ignores when
#                                  the dep graph evolves)
#   * licenses.allow             → permissive set + GPL-3.0-or-later
#                                  (the Zed crates behind GPUI)
#   * sources                    → unknown-registry / unknown-git deny
#
# Every entry in this file is meant to match something in Cargo.lock.
# cargo-deny only *warns* about an entry that matches nothing
# (`advisory-not-detected`, `license-not-encountered`,
# `license-exception-not-encountered`, `unmatched-source`), so the gate
# stays green while the policy drifts; the workspace test
# `src-app/tests/dependency_policy_drift.rs` turns the entries that were
# found dead on 2026-09-01 (issue #213) into a failing test instead.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Treat unmaintained crates as a workspace-scoped warn (not a blanket
# dep-tree warn). "workspace" scope: only direct workspace members'
# own dependencies are flagged, not 10-hop transitive deps that we
# cannot influence without bumping the root dep.
unmaintained = "workspace"
# Yanked crates: warn-only. A yanked transitive dep often lingers in the
# lockfile until the parent publishes a bump; blocking on yanked would
# create bandwidth-vs-noise pressure that isn't warranted. When the
# yanked release has an in-place patched successor (the `spin 0.9.8` /
# `0.10.0` case, issue #213), fix it with a targeted
# `cargo update -p <crate>@<yanked> --precise <patched>` rather than a
# broad `cargo update`.
yanked = "warn"
# Fail if the local copy of the RustSec advisory DB is older than 30
# days - guards against a stale CI runner silently missing recent
# advisories. P30D is ISO 8601 duration syntax (30 days).
maximum-db-staleness = "P30D"
# Surface stale `ignore` entries - when a dep tree change drops the
# vulnerable crate, the corresponding ignore becomes inert noise.
# Warn (don't fail) so a routine GPUI bump doesn't suddenly block a
# tag cut; the warning bubbles up to the CI log and gets cleaned in
# the next deny.toml maintenance pass. Mirrors Bevy's pattern.
unused-ignored-advisory = "warn"

# Explicit advisory ignores. Each entry below MUST document:
#   1. why the advisory does not apply to PaneFlow's threat model
#   2. what triggers re-evaluation (upstream patch, code-path change)
# Reviewed 2026-09-01 against the live graph (`cargo tree -i <crate>@<ver>
# --target all`); an ignore whose crate leaves the lockfile is removed,
# not kept for history (RUSTSEC-2023-0071 / `rsa` went that way when the
# zed-industries/zed pin stopped pulling zed/rpc).
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 - quick-xml CPU and memory
    # denial-of-service issues in duplicate-attribute and namespace handling.
    # Both advisories are patched only in quick-xml >= 0.41.0.
    #
    # Why ignored:
    #   * Two quick-xml releases are locked, and neither is reachable on the
    #     one target this fork builds (`cargo tree -i quick-xml@<ver>` prints
    #     nothing for aarch64-apple-darwin; both only appear under
    #     `--target all`):
    #       - quick-xml 0.30.0 via xcb 1.7 (X11 bindings behind GPUI's
    #         Linux platform layer),
    #       - quick-xml 0.39.2 via zbus_xml 5 <- zbus-lockstep /
    #         zbus-lockstep-macros <- atspi-common (Linux accessibility
    #         D-Bus tooling behind GPUI).
    #     cargo-deny evaluates every target, so the lockfile entries still
    #     match the advisories even though no macOS binary links them.
    #   * PaneFlow has no direct quick_xml usage (`rg 'quick_xml|quick-xml'
    #     src-app crates -g '*.rs'` returns no Rust call sites), so the app
    #     cannot apply the upstream workaround (`attributes().with_checks(false)`)
    #     locally.
    #   * Cargo cannot move either instance to quick-xml >= 0.41.0 without
    #     parent crate releases: xcb 1.7 requires ^0.30 and zbus_xml 5.1
    #     requires ^0.39.2. A forced lockfile update fails dependency selection.
    #
    # Re-evaluation triggers:
    #   * xcb and zbus_xml publish releases on quick-xml >= 0.41.0 and the
    #     GPUI pin picks them up,
    #   * OR a GPUI pin bump drops the Linux X11 / atspi layers from the
    #     lockfile entirely (then remove these ignores; cargo-deny will flag
    #     them as `advisory-not-detected`),
    #   * OR PaneFlow adds direct XML parsing or any `use quick_xml::` call
    #     site.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # NOTE: a preemptive ignore for RUSTSEC-2025-0052 (async-std
    # discontinued) was removed in 2026-05 -- `async-std` is NOT in
    # Cargo.lock (the zed-industries/zed pin does not pull
    # zed/http_client → async-tar → async-std). Re-add it ONLY if a future
    # GPUI-pin bump reintroduces async-std into the tree.
]

[licenses]
# Permissive-license allow list. An unlisted license raises a warning
# per the sources deny posture below. Covers the Rust ecosystem
# mainstream plus the specific ones present in the current Cargo.lock
# (Unicode-3.0 for the Unicode crates, Zlib for miniz_oxide, BSD
# variants for misc parsers, plus extras pulled in by GPUI's image /
# font-kit dep tree: 0BSD, MPL-2.0, CC0-1.0, bzip2-1.0.6 - all
# OSI-approved or public-domain-equivalent). An allowance that no locked
# crate uses is removed, not kept "just in case": cargo-deny reports it as
# `license-not-encountered` and the drift test above pins the removals.
#
# GPL-3.0-or-later - accepted globally (2026-05-27). The Zed monorepo we
# pin GPUI from contains dozens of crates licensed `GPL-3.0-or-later`
# that land in our dep tree as transitive deps of `gpui` /
# `gpui_platform`, and the PaneFlow workspace itself is
# `GPL-3.0-or-later`. The previous per-crate `[[licenses.exceptions]]`
# was unsustainable - every GPUI pin bump shifted the list and the CI
# gate fell out of sync. PaneFlow already statically links these, so
# cargo-deny's noise-vs-block dilemma was the wrong frame: the right
# question is whether PaneFlow's binary distribution license is
# GPL-3-compatible. It is (same posture Zed itself ships under).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "bzip2-1.0.6",
    "GPL-3.0-or-later",
]

# No per-crate license exceptions. The last one (BSL-1.0 for
# xxhash-rust@0.8, reached through Zed's fs -> notify path) was removed
# when that crate left the lockfile; a new BSL-1.0 dependency is therefore
# still rejected until someone scopes an exception to it here.

[sources]
# Block unknown crate registries or git sources. Require tags or immutable
# revisions: the sole reviewed tag is locked to its resolved commit by the
# workspace dependency_source_policy test.
unknown-registry = "deny"
unknown-git      = "deny"
required-git-spec = "rev"
# Pin the crates.io registry explicitly; anything else is "unknown".
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
# Keep repository authorization exact. Organization-wide grants would let a
# transitive update introduce an unrelated repository without review. Every
# repository listed here has a `source = "git+..."` entry in Cargo.lock; one
# that stops matching (zed-industries/scap, dropped by the current GPUI pin)
# is removed rather than left as a standing grant.
allow-git = [
    "https://github.com/proptest-rs/proptest",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/zed",
]
