name: release

on:
  push:
    tags: ["v*"]
  # Dry-run dispatch. Builds, signs, notarizes, and stages the DMG, but
  # skips the GitHub Release. Use this to validate the signing chain on a
  # branch before cutting a tag. Artifacts land as workflow artifacts with
  # 7-day retention.
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run semver (no v prefix, e.g. 0.1.0-rc.1)"
        required: true
        type: string
      target_ref:
        description: "Git ref to build from"
        required: false
        type: string
        default: main

permissions:
  contents: write

# Serialize releases by ref. A tag-push race (or a dry-run launched on
# top of a real tag) should not double-publish. Grouped by ref_name so
# different tags do not block each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  # Pin Xcode 16.4. Proof the Metal compiler actually runs is
  # `xcrun metal --version` in the preflight step — `xcrun -f metal`
  # / `xcrun --find metal` resolve a path even when the toolchain
  # component is missing.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  # Tag-push: github.ref_name is the tag. Dry-run: synthesize v<inputs.version>
  # so every ${TAG#v} strip stays correct.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_ref || 'main') || github.ref_name }}
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'release' }}
  TARGET: aarch64-apple-darwin
  ARCH: aarch64

jobs:
  build:
    name: Build aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Select Xcode 16.4 and verify Metal compiler
        run: |
          if [ ! -d "${DEVELOPER_DIR}" ]; then
            echo "::error::Xcode 16.4 not found at ${DEVELOPER_DIR}."
            echo "::error::Installed Xcode apps:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "${DEVELOPER_DIR}"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun --show-sdk-path

          # Proof is a real compile-tool invocation, not a path lookup.
          if ! xcrun metal --version; then
            echo "::warning::Metal toolchain missing from Xcode 16.4; downloading MetalToolchain."
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          # Must match rust-toolchain.toml verbatim.
          toolchain: "1.96.1"
          components: rustfmt, clippy
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: ${{ env.TARGET }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --locked --target "$TARGET" -- -D warnings

      # Tag-push must bake a non-empty minisign public key. An unset
      # Actions variable interpolates as "", so option_env! is Some("")
      # and embedded_public_keys() drops the empty slot: cargo still
      # exits 0. Fail here, before cargo build, so we never produce a
      # release binary that cannot verify updates. Dry-run may still
      # build without a key (existing unsigned-dry-run posture).
      - name: Require minisign public key for tag-push
        env:
          PANEFLOW_MINISIGN_PUBKEY: ${{ vars.PANEFLOW_MINISIGN_PUBKEY }}
        run: |
          # Same emptiness rule as APPLE_TEAM_ID in Detect: whitespace
          # is missing. Do not strip for the bake; Build still receives
          # the raw var and Rust trims the slot at use.
          pubkey="$(printf '%s' "${PANEFLOW_MINISIGN_PUBKEY:-}" | tr -d '[:space:]')"
          if [ -n "${pubkey}" ]; then
              echo "PANEFLOW_MINISIGN_PUBKEY is set - will bake into the binary."
          else
              if [ "${RELEASE_MODE}" = "release" ]; then
                  echo "::error title=minisign public key required::vars.PANEFLOW_MINISIGN_PUBKEY is empty. Tag-push builds must bake a minisign public key so the in-app updater can verify downloads. Set the repository variable (Settings → Secrets and variables → Actions → Variables). See docs/self-update-signing.md."
                  exit 1
              fi
              echo "::warning title=minisign public key missing::vars.PANEFLOW_MINISIGN_PUBKEY is empty - this dry-run binary cannot verify self-updates. See docs/self-update-signing.md."
          fi

      - name: Build release binary
        env:
          # Public minisign keys (repository variables, never secrets).
          # Baked in via option_env! so the in-app updater can verify
          # downloaded DMGs. An unset var interpolates as ""; the
          # previous step already refused tag-push on empty/whitespace.
          # Dry-run may still bake empty (has_embedded_key() is false).
          PANEFLOW_MINISIGN_PUBKEY: ${{ vars.PANEFLOW_MINISIGN_PUBKEY }}
          PANEFLOW_MINISIGN_PUBKEY_NEXT: ${{ vars.PANEFLOW_MINISIGN_PUBKEY_NEXT }}
          # Same secret later used to codesign. Baked via option_env! so
          # verify_macos_bundle pins leaf[subject.OU] to this Team ID.
          # Unset interpolates as ""; the binary treats empty as missing
          # and fail-closes the pin (no hardcoded fallback).
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo build --release -p paneflow-app --locked --target "$TARGET"

      - name: Produce .app bundle
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          file "target/${TARGET}/release/paneflow"
          bash scripts/bundle-macos.sh --version "$version" --arch "$ARCH"

      # Five Apple secrets, routed through env: so an empty secret is
      # empty rather than the literal `${{ secrets.NAME }}` string.
      #
      # APPLE_DEVELOPER_CERT_P12 and APPLE_DEVELOPER_CERT_PASSWORD are a
      # split, not a truncated name: P12 is the PKCS#12 blob, PASSWORD
      # decrypts it. There is no APPLE_DEVELOPER_CERT_P secret.
      # See docs/release-runbook.md.
      #
      # Tag-push releases fail hard when any secret is missing. Dry-runs
      # may emit an unsigned .app for inspection; they never produce a
      # DMG (create-dmg.sh requires a stapled ticket).
      - name: Detect macOS signing secrets
        id: macos_signing
        env:
          APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # APPLE_TEAM_ID is also baked into the binary at the Build step
          # via option_env!. A whitespace-only value would codesign later
          # but leave the updater pin empty (fail-closed at install). Treat
          # whitespace as missing so tag-push still fails here cheaply.
          team_id="$(printf '%s' "${APPLE_TEAM_ID:-}" | tr -d '[:space:]')"
          if [ -n "${APPLE_DEVELOPER_CERT_P12:-}" ] \
             && [ -n "${APPLE_DEVELOPER_CERT_PASSWORD:-}" ] \
             && [ -n "${APPLE_ID:-}" ] \
             && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] \
             && [ -n "${team_id}" ]; then
              echo "All 5 Apple signing secrets are present - will sign + notarize."
              echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
              if [ "${RELEASE_MODE}" = "release" ]; then
                  echo "::error title=macOS signing required::One or more APPLE_* secrets are missing. Tag-push releases must sign and notarize. APPLE_TEAM_ID is also baked into the binary at Build via option_env!."
                  exit 1
              fi
              echo "::warning title=macOS signing skipped::One or more APPLE_* secrets are missing - emitting an UNSIGNED .app. See docs/release-runbook.md."
              echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign macOS .app bundle
        if: steps.macos_signing.outputs.signing_available == 'true'
        env:
          APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh dist/PaneFlow.app

      - name: Notarize + staple macOS .app bundle
        id: notarize
        if: steps.macos_signing.outputs.signing_available == 'true'
        # Dry-run: a transient Apple Notary outage must not fail the
        # whole leg. Tag-push stays hard-required.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-macos.sh dist/PaneFlow.app

      - name: Record unsigned macOS build in job summary
        if: steps.macos_signing.outputs.signing_available != 'true'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          {
              echo "## Unsigned macOS build (${TAG})"
              echo
              echo "One or more APPLE_* secrets were missing, so this leg shipped an"
              echo "**unsigned, un-notarized** \`PaneFlow.app\`. Gatekeeper will"
              echo "block first-launch with the \"can't be opened\" prompt."
              echo
              echo "Required secrets: \`APPLE_DEVELOPER_CERT_P12\`,"
              echo "\`APPLE_DEVELOPER_CERT_PASSWORD\`, \`APPLE_ID\`,"
              echo "\`APPLE_APP_SPECIFIC_PASSWORD\`, \`APPLE_TEAM_ID\`."
              echo
              echo "Onboarding: \`docs/release-runbook.md\` and \`docs/release/macos-signing.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned .app for inspection
        if: github.event_name == 'workflow_dispatch' && steps.macos_signing.outputs.signing_available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/PaneFlow.app
          retention-days: 7

      # macos-15 hosted runners are tight on disk after a GPUI release
      # build. The binary is already inside dist/PaneFlow.app; nothing
      # downstream reads target/.
      - name: Free disk space before .dmg packaging
        run: |
          echo "::group::Disk space before cleanup"
          df -h /
          du -sh target/ 2>/dev/null || true
          echo "::endgroup::"
          rm -rf target/
          echo "::group::Disk space after cleanup"
          df -h /
          echo "::endgroup::"

      # Filename shape is a contract with the in-app updater
      # (src-app/src/update/checker.rs): paneflow-<semver>-aarch64-apple-darwin.dmg
      - name: Produce .dmg
        if: steps.macos_signing.outputs.signing_available == 'true' && steps.notarize.outcome == 'success'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          bash scripts/create-dmg.sh --version "$version" --arch "$ARCH"

      - name: Stage macOS .dmg
        if: steps.macos_signing.outputs.signing_available == 'true' && steps.notarize.outcome == 'success'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          mkdir -p release-assets
          version="${TAG#v}"
          dmg="paneflow-${version}-${ARCH}-apple-darwin.dmg"
          cp "dist/${dmg}" "release-assets/${dmg}"
          if [ ! -s "release-assets/${dmg}" ]; then
            echo "::error::release-assets/${dmg} is missing or empty, refusing to hash."
            exit 1
          fi
          ( cd release-assets && shasum -a 256 "${dmg}" > "${dmg}.sha256" )
          ls -la release-assets/

      - name: Verify release artifacts staged
        run: |
          if [ ! -d release-assets ] || ! find release-assets -maxdepth 1 -type f | grep -q .; then
            if [ "${RELEASE_MODE}" = "dry-run" ]; then
              echo "::warning::No release artifacts were staged. Dry-run upload will be empty."
              exit 0
            fi
            echo "::error::No release artifacts were staged in release mode."
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-aarch64-macOS
          path: release-assets/
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && 'warn' || 'error' }}
          retention-days: 7
          compression-level: 0

      - name: Dry-run artifact summary
        if: github.event_name == 'workflow_dispatch'
        env:
          DRYRUN_TAG: ${{ env.RELEASE_TAG }}
          DRYRUN_REF: ${{ env.RELEASE_REF }}
        run: |
          {
            echo "## Dry-run artifacts (${DRYRUN_TAG})"
            echo
            echo "Built from \`${DRYRUN_REF}\`. Workflow artifacts have"
            echo "7-day retention."
            echo
            echo "| Asset | Size | SHA-256 |"
            echo "|---|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -d release-assets ]; then
            echo "_No staged release assets (unsigned dry-run)._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s nullglob
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256) continue ;;
            esac
            name="$(basename "$f")"
            size="$(stat -f '%z' "$f")"
            hash="$(shasum -a 256 "$f" | awk '{print $1}')"
            echo "| \`${name}\` | ${size} | \`${hash}\` |"
          done >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Verify merged release artifacts
        run: |
          if [ ! -d release-assets ] || ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "::error::No release artifacts were downloaded. Refusing to create an empty GitHub Release."
            exit 1
          fi

      # Sign the DMG with the project minisign key so clients can verify
      # downloads against the public key baked into their binary. Missing
      # key is a hard failure: clients with embedded keys verify
      # fail-closed, so an unsigned release would publish unusable
      # self-update assets.
      - name: Sign release artifacts (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is required. Clients with an embedded key refuse unsigned self-update assets."
            exit 1
          fi
          MINISIGN_VERSION=0.12
          MINISIGN_SHA256=89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63
          curl -sSfL --retry 3 -o /tmp/minisign.zip \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-macos.zip"
          echo "${MINISIGN_SHA256}  /tmp/minisign.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/bin" /tmp/minisign-macos
          unzip -o /tmp/minisign.zip -d /tmp/minisign-macos minisign
          install -m 0755 /tmp/minisign-macos/minisign "$HOME/bin/minisign"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          minisign -v
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "$key_file"
          chmod 600 "$key_file"
          shopt -s nullglob
          for f in release-assets/*; do
            case "$f" in
              *.sha256|*.minisig) continue ;;
            esac
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            minisign -S -s "$key_file" -m "$f" \
              -t "paneflow release artifact ${base}" >/dev/null
            echo "signed: ${base} -> ${base}.minisig"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          # Keep the release hidden from /releases/latest until every
          # signed asset is attached. The updater fetches <asset>.minisig
          # and fails closed, so exposing a half-populated release looks
          # like a tampered artifact to clients that click Update.
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}

      - name: Verify uploaded release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          local_assets="$(mktemp)"
          remote_assets="$(mktemp)"
          trap 'rm -f "$local_assets" "$remote_assets"' EXIT

          find release-assets -maxdepth 1 -type f -exec basename {} \; | sort > "$local_assets"
          gh release view "${RELEASE_TAG}" \
            --json assets \
            --jq '.assets[].name' \
            | sort > "$remote_assets"

          if ! diff -u "$local_assets" "$remote_assets"; then
            echo "::error::Uploaded release assets do not match signed local artifacts."
            exit 1
          fi

      - name: Publish GitHub Release after asset verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${RELEASE_TAG}" --draft=false
