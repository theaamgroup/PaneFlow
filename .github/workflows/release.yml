name: release

on:
  push:
    tags: ["v*"]
  # Dry-run dispatch. Builds, signs, notarizes, and stages the DMG, but
  # skips the GitHub Release. Use this from main to validate the signing chain
  # before cutting a tag. Artifacts land as workflow artifacts with
  # 7-day retention.
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run semver (no v prefix, e.g. 0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

# Serialize releases by ref. A tag-push race (or a dry-run launched on
# top of a real tag) should not double-publish. Grouped by ref_name so
# different tags do not block each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  # Pin Xcode 16.4. Proof the Metal compiler actually runs is
  # `xcrun metal --version` in the preflight step — `xcrun -f metal`
  # / `xcrun --find metal` resolve a path even when the toolchain
  # component is missing.
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  # Tag-push: github.ref_name is the tag. Dry-run: synthesize v<inputs.version>
  # so every ${TAG#v} strip stays correct.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  # Dry-runs are intentionally main-only. Allowing an arbitrary checkout here
  # would execute branch-controlled scripts while release credentials exist.
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref_name }}
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'release' }}
  TARGET: aarch64-apple-darwin
  ARCH: aarch64

jobs:
  build:
    name: Build aarch64-apple-darwin
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Select Xcode 16.4 and verify Metal compiler
        run: |
          if [ ! -d "${DEVELOPER_DIR}" ]; then
            echo "::error::Xcode 16.4 not found at ${DEVELOPER_DIR}."
            echo "::error::Installed Xcode apps:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "${DEVELOPER_DIR}"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          xcrun --show-sdk-path

          # Proof is a real compile-tool invocation, not a path lookup.
          if ! xcrun metal --version; then
            echo "::warning::Metal toolchain missing from Xcode 16.4; downloading MetalToolchain."
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (master as of 2026-08-05)
        with:
          # Must match rust-toolchain.toml verbatim.
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: ${{ env.TARGET }}

      - name: Verify release version matches Cargo.toml
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          tag_version="${TAG#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "paneflow-app") | .version')"
          if [ -z "$manifest_version" ] || [ "$manifest_version" = "null" ]; then
            echo "::error::Could not resolve paneflow-app version from cargo metadata."
            exit 1
          fi
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Release tag version $tag_version does not match Cargo.toml version $manifest_version."
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: ${{ env.TARGET }}

      - name: cargo fmt --check
        run: cargo fmt --check

      # `--all-targets` to match run_tests.yml and the local gate in CLAUDE.md;
      # without it test-only modules are never linted.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings

      # Workspace suite BEFORE the release build so a failing test aborts
      # the run before the bundle / sign / notarize spend (issue #71). Same
      # invocation as run_tests.yml::macos_check.
      - name: cargo test --workspace
        run: cargo test --workspace --locked --target "$TARGET"

      - name: Build release binary
        run: cargo build --release -p paneflow-app --locked --target "$TARGET"

      - name: Produce .app bundle
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          file "target/${TARGET}/release/paneflow"
          bash scripts/bundle-macos.sh --version "$version" --arch "$ARCH"

      # Five Apple secrets, routed through env: so an empty secret is
      # empty rather than the literal `${{ secrets.NAME }}` string.
      #
      # APPLE_DEVELOPER_CERT_P12 and APPLE_DEVELOPER_CERT_PASSWORD are a
      # split, not a truncated name: P12 is the PKCS#12 blob, PASSWORD
      # decrypts it. There is no APPLE_DEVELOPER_CERT_P secret.
      # See docs/release-runbook.md.
      #
      # Tag-push releases fail hard when any secret is missing. Dry-runs
      # may emit an unsigned .app for inspection; they never produce a
      # DMG (create-dmg.sh requires a stapled ticket).
      - name: Detect macOS signing secrets
        id: macos_signing
        env:
          APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Treat whitespace-only APPLE_TEAM_ID as missing so tag-push
          # fails here cheaply instead of at codesign/notarize.
          team_id="$(printf '%s' "${APPLE_TEAM_ID:-}" | tr -d '[:space:]')"
          if [ -n "${APPLE_DEVELOPER_CERT_P12:-}" ] \
             && [ -n "${APPLE_DEVELOPER_CERT_PASSWORD:-}" ] \
             && [ -n "${APPLE_ID:-}" ] \
             && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] \
             && [ -n "${team_id}" ]; then
              echo "All 5 Apple signing secrets are present - will sign + notarize."
              echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
              if [ "${RELEASE_MODE}" = "release" ]; then
                  echo "::error title=macOS signing required::One or more APPLE_* secrets are missing. Tag-push releases must sign and notarize."
                  exit 1
              fi
              echo "::warning title=macOS signing skipped::One or more APPLE_* secrets are missing - emitting an UNSIGNED .app. See docs/release-runbook.md."
              echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign macOS .app bundle
        if: steps.macos_signing.outputs.signing_available == 'true'
        env:
          APPLE_DEVELOPER_CERT_P12: ${{ secrets.APPLE_DEVELOPER_CERT_P12 }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh dist/PaneFlow.app

      - name: Notarize + staple macOS .app bundle
        id: notarize
        if: steps.macos_signing.outputs.signing_available == 'true'
        # Dry-run: a transient Apple Notary outage must not fail the
        # whole leg. Tag-push stays hard-required.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-macos.sh dist/PaneFlow.app

      - name: Record unsigned macOS build in job summary
        if: steps.macos_signing.outputs.signing_available != 'true'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          {
              echo "## Unsigned macOS build (${TAG})"
              echo
              echo "One or more APPLE_* secrets were missing, so this leg shipped an"
              echo "**unsigned, un-notarized** \`PaneFlow.app\`. Gatekeeper will"
              echo "block first-launch with the \"can't be opened\" prompt."
              echo
              echo "Required secrets: \`APPLE_DEVELOPER_CERT_P12\`,"
              echo "\`APPLE_DEVELOPER_CERT_PASSWORD\`, \`APPLE_ID\`,"
              echo "\`APPLE_APP_SPECIFIC_PASSWORD\`, \`APPLE_TEAM_ID\`."
              echo
              echo "Onboarding: \`docs/release-runbook.md\` and \`docs/release/macos-signing.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned .app for inspection
        if: github.event_name == 'workflow_dispatch' && steps.macos_signing.outputs.signing_available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/PaneFlow.app
          retention-days: 7

      # macos-15 hosted runners are tight on disk after a GPUI release
      # build. The binary is already inside dist/PaneFlow.app; nothing
      # downstream reads target/.
      - name: Free disk space before .dmg packaging
        run: |
          echo "::group::Disk space before cleanup"
          df -h /
          du -sh target/ 2>/dev/null || true
          echo "::endgroup::"
          rm -rf target/
          echo "::group::Disk space after cleanup"
          df -h /
          echo "::endgroup::"

      # Filename shape: paneflow-<semver>-aarch64-apple-darwin.dmg
      - name: Produce .dmg
        if: steps.macos_signing.outputs.signing_available == 'true' && steps.notarize.outcome == 'success'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="${TAG#v}"
          bash scripts/create-dmg.sh --version "$version" --arch "$ARCH"

      - name: Stage macOS .dmg
        if: steps.macos_signing.outputs.signing_available == 'true' && steps.notarize.outcome == 'success'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          mkdir -p release-assets
          version="${TAG#v}"
          dmg="paneflow-${version}-${ARCH}-apple-darwin.dmg"
          cp "dist/${dmg}" "release-assets/${dmg}"
          if [ ! -s "release-assets/${dmg}" ]; then
            echo "::error::release-assets/${dmg} is missing or empty, refusing to hash."
            exit 1
          fi
          ( cd release-assets && shasum -a 256 "${dmg}" > "${dmg}.sha256" )
          ls -la release-assets/

      - name: Generate signed Sparkle appcast
        if: steps.macos_signing.outputs.signing_available == 'true' && steps.notarize.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            if [ "$RELEASE_MODE" = "release" ]; then
              echo "::error::SPARKLE_PRIVATE_KEY is required for tag-push releases."
              exit 1
            fi
            echo "::warning::SPARKLE_PRIVATE_KEY is missing; dry-run appcast generation skipped."
            exit 0
          fi

          version="${TAG#v}"
          dmg="paneflow-${version}-${ARCH}-apple-darwin.dmg"
          notes="release-assets/${dmg%.dmg}.md"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > "$notes"

          sparkle_dist="$(scripts/sparkle-dist.sh)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$sparkle_dist/bin/generate_appcast" \
                --ed-key-file - \
                --versions "$version" \
                --maximum-versions 1 \
                --maximum-deltas 0 \
                --embed-release-notes \
                --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
                --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
                -o "$PWD/release-assets/appcast.xml" \
                "$PWD/release-assets"
          rm -f "$notes"

          xmllint --noout release-assets/appcast.xml
          grep -Fq "<sparkle:version>${version}</sparkle:version>" release-assets/appcast.xml
          grep -Fq "sparkle:edSignature=" release-assets/appcast.xml
          grep -Fq "$dmg" release-assets/appcast.xml

          signature="$(xmllint --xpath \
            'string(//*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
            release-assets/appcast.xml)"
          [ -n "$signature" ] || {
            echo "::error::Sparkle appcast enclosure has no EdDSA signature."
            exit 1
          }
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$sparkle_dist/bin/sign_update" \
                --verify --ed-key-file - "release-assets/$dmg" "$signature"

          tampered_dmg="$(mktemp "${RUNNER_TEMP}/paneflow-tampered.XXXXXX.dmg")"
          cp "release-assets/$dmg" "$tampered_dmg"
          printf '\0' >> "$tampered_dmg"
          if printf '%s' "$SPARKLE_PRIVATE_KEY" \
              | "$sparkle_dist/bin/sign_update" \
                  --verify --ed-key-file - "$tampered_dmg" "$signature"; then
            echo "::error::Sparkle accepted a deliberately tampered DMG."
            rm -f "$tampered_dmg"
            exit 1
          fi
          rm -f "$tampered_dmg"

          if find release-assets -maxdepth 1 -name '*.delta' -print -quit | grep -q .; then
            echo "::error::Delta updates are not enabled for PaneFlow releases."
            exit 1
          fi
          ls -la release-assets/

      - name: Verify release artifacts staged
        run: |
          if [ ! -d release-assets ] || ! find release-assets -maxdepth 1 -type f | grep -q .; then
            if [ "${RELEASE_MODE}" = "dry-run" ]; then
              echo "::warning::No release artifacts were staged. Dry-run upload will be empty."
              exit 0
            fi
            echo "::error::No release artifacts were staged in release mode."
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-aarch64-macOS
          path: release-assets/
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && 'warn' || 'error' }}
          retention-days: 7
          compression-level: 0

      - name: Dry-run artifact summary
        if: github.event_name == 'workflow_dispatch'
        env:
          DRYRUN_TAG: ${{ env.RELEASE_TAG }}
          DRYRUN_REF: ${{ env.RELEASE_REF }}
        run: |
          {
            echo "## Dry-run artifacts (${DRYRUN_TAG})"
            echo
            echo "Built from \`${DRYRUN_REF}\`. Workflow artifacts have"
            echo "7-day retention."
            echo
            echo "| Asset | Size | SHA-256 |"
            echo "|---|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -d release-assets ]; then
            echo "_No staged release assets (unsigned dry-run)._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s nullglob
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256) continue ;;
            esac
            name="$(basename "$f")"
            size="$(stat -f '%z' "$f")"
            hash="$(shasum -a 256 "$f" | awk '{print $1}')"
            echo "| \`${name}\` | ${size} | \`${hash}\` |"
          done >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Verify merged release artifacts
        run: |
          if [ ! -d release-assets ] || ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "::error::No release artifacts were downloaded. Refusing to create an empty GitHub Release."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          # Keep the release hidden from /releases/latest until every
          # staged asset is attached and verified against the local set.
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}

      - name: Verify uploaded release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          local_assets="$(mktemp)"
          remote_assets="$(mktemp)"
          trap 'rm -f "$local_assets" "$remote_assets"' EXIT

          find release-assets -maxdepth 1 -type f -exec basename {} \; | sort > "$local_assets"
          gh release view "${RELEASE_TAG}" \
            --json assets \
            --jq '.assets[].name' \
            | sort > "$remote_assets"

          if ! diff -u "$local_assets" "$remote_assets"; then
            echo "::error::Uploaded release assets do not match signed local artifacts."
            exit 1
          fi

      - name: Publish GitHub Release after asset verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${RELEASE_TAG}" --draft=false
