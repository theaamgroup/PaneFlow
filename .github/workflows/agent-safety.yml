name: Agent safety routing

on:
  issues:
    types: [opened, reopened, closed, edited, labeled, unlabeled, assigned, unassigned]
  pull_request_target:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled, assigned, unassigned, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-safety-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      # Both PR heads and stacked PR bases are untrusted. Execute policy only
      # from protected main, never from either PR-supplied revision.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Test trusted policy
        run: node --test scripts/agent-policy.test.cjs
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { sync } = require('./scripts/agent-policy.cjs');
            await sync({ github, context, core });
