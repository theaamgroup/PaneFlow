[package]
name = "paneflow-mcp-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One-time cleanup that removes the retired PaneFlow MCP bridge from agent configs and deletes its extracted binary (issue #857). Deleted by issue #868."

[dependencies]
# `preserve_order` keeps an agent config's existing key order when the
# cleanup rewrites a JSON file (IndexMap, not the default sorted BTreeMap),
# so removing the `paneflow` entry does not reorder the user's whole
# `~/.claude.json`. Cargo feature unification propagates this to
# paneflow-app's serde_json too (harmless: JSON object key order is not
# semantically meaningful).
serde_json = { workspace = true, features = ["preserve_order"] }
# Format-preserving TOML editing (comments + key order) for Codex's
# `~/.codex/config.toml`, so removing `[mcp_servers.paneflow]` leaves every
# other table and comment as the user wrote it.
toml_edit = "0.25"
dirs.workspace = true
anyhow.workspace = true
# One `info` line per config changed, one `warn` per agent skipped, through
# the host's env_logger.
log.workspace = true
# Used by `io::write_atomic` for same-dir temp file + atomic rename (not
# test-only), so it lives in [dependencies], not [dev-dependencies].
tempfile.workspace = true
# Shared cross-process config lock (OS advisory, crash-safe), bounded config
# reads, and the JSONC surgical editor.
paneflow-agent-config.workspace = true

[lints]
workspace = true
