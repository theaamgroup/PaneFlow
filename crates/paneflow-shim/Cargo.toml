[package]
name = "paneflow-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "paneflow-shim"
path = "src/main.rs"

[dependencies]
# US-005: idempotent merge of `.claude/settings.local.json` + atomic rename.
# `preserve_order` keeps the user's key order: without it `serde_json::Map` is a
# BTreeMap and every shim rewrite silently alphabetizes the user's config keys.
# `cargo test --workspace` cannot catch this - feature unification turns the
# feature on there when any other workspace crate enables it, while the nested
# `release-min` build that ships has it off.
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
# Cross-platform file identity for the hardlink loop guard.
same-file = "1"
paneflow-agent-config.workspace = true

# Signal disposition control - required to make Ctrl+C / SIGHUP / SIGTERM
# only reach the child claude/codex process (so the AI sees the
# interrupt) while the shim survives long enough to send `ai.session_end`
# to PaneFlow's IPC server. Same pattern time(1) / tee(1) / sudo(8) use.
libc.workspace = true
# Wall-clock deadline for synthesized hook children (issue #26).
paneflow-process.workspace = true

[dev-dependencies]
# Test oracle for the Codex `config.toml` scanner (#1053). Dev-only, so the
# size-capped release helper does not link a TOML parser.
toml = "1"
# Issue #1127: the pipe-window hook, to hold `spawn_piped`'s window open
# while the interrupt Stop hook spawns. Dev-only, so the shipped shim never
# compiles it in.
paneflow-process = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
