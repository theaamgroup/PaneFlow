[package]
name = "paneflow-app"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[[bin]]
name = "paneflow"
path = "src/main.rs"

[dependencies]
# GPUI framework pinned to a minimal Paneflow fork of Zed. The pinned commit
# is based on zed-industries/zed@afc13dc8 and carries one additive performance
# patch: `Markdown::append` accumulates streamed chunks in a private String
# buffer while preserving Zed's `source() -> &SharedString` contract. The fork
# also keeps the append-throughput Criterion benchmark.
#
# Switchover: when the append optimization lands in zed-industries/zed, point
# the eight entries back to upstream and keep an exact tested revision. Until
# then, create each bump from the chosen upstream revision, reapply the patch,
# publish the fork commit, update every `rev` below, then run `cargo update`.
#
# `gpui_platform` MUST carry the `font-kit` feature on macOS - without it,
# `gpui_macos` compiles cleanly but the optional `zed-font-kit` dep + Core
# Text glyph rasterization path are excluded (gated on `dep:font-kit` in
# `gpui_macos/Cargo.toml`). The visible symptom is the v0.2.12 "boxes
# drawn, no glyphs" bug: fonts register via `add_fonts()`, `font_id`
# resolves PRIMARY MATCH, the window opens, SVG icons + cursor quads
# paint correctly, but every text glyph rasterizes as an empty bitmap.
# Zed enables this feature explicitly in `zed/crates/zed/Cargo.toml`.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fecc3273ed32643c2ea1b04a74c8780e2c9ffaf8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fecc3273ed32643c2ea1b04a74c8780e2c9ffaf8", features = ["font-kit"] }

# Zed markdown rendering pipeline + design-system primitives. Pinned at the
# same rev as gpui so the workspace graph resolves consistently. Pulls ~51
# Zed workspace crates transitively (language/theme/ui/lsp/...) - accepted
# trade-off for visual parity with Zed's agent panel.
# Bootstraps Zed's `GlobalTheme` at startup. `MarkdownElement::paint` reads
# `cx.theme().colors()` unconditionally for secondary chrome (borders, panel
# backgrounds, etc.) regardless of the `MarkdownStyle` we pass in, so the
# global must exist. `theme::init(LoadThemes::JustBase, cx)` is the minimal
# bootstrap - no JSON theme bundles, no `theme_settings` integration.
# Zed's design-system primitives (Icon + IconName, Disclosure, Label, ...).
# Pinned at the same rev as gpui/markdown/theme. Required so the agent-panel
# thinking + tool-call rows match Zed's exact rendering (`Icon::new(IconName::
# ToolSearch).size(IconSize::Small).color(Color::Muted)` etc.) instead of
# hand-rolled svg() paths.

# Alacritty terminal emulation (upstream crates.io - migrated from Zed fork in US-005)
alacritty_terminal = "0.26"
# EP-003 US-006: named directly because the `TeePty` byte tap implements
# alacritty_terminal's public `tty::EventedReadWrite` traits, whose
# signatures expose `polling` types (not re-exported by the crate). Same
# semver line as alacritty_terminal's own dependency - one shared instance.
polling = "3"

# Internal crates
paneflow-config = { path = "../crates/paneflow-config" }
# Legacy agent identity plus the CLAUDECODE env scrub. The terminal-only
# Agents view no longer carries the in-app ACP chat or SDK wrapper here.
paneflow-acp = { path = "../crates/paneflow-acp" }
# EP-002 (prd-mcp-bridge-distribution): GPU-free install engine behind
# `paneflow mcp install|uninstall|status`. Kept in its own crate so its
# `toml_edit` dep stays out of the size-budgeted embedded `paneflow-mcp`
# bridge binary (PRD decision D3).
paneflow-mcp-install = { path = "../crates/paneflow-mcp-install" }
# EP-002 (prd-ultron-remediation): std-only bounded-subprocess primitive
# (`run_with_timeout`) adopted at every external-process call site (git,
# opencode, mcp-install) so a hung tool can't wedge a worker.
paneflow-process = { workspace = true }
# EP-001 (prd-cli-agent-orchestration): the shared blocking JSON-RPC client the
# `paneflow <verb>` CLI subcommands use to drive a RUNNING instance over the
# existing IPC socket and exit before any GPUI init.
paneflow-ipc-client = { workspace = true }
# File system watcher (OS-native: inotify/FSEvents/ReadDirectoryChanges)
notify = "7"

# Hot-path Mutex / RwLock without poisoning, ~2x faster than std under
# contention. Used for the theme cache that's hit several times per
# render frame; std::sync::Mutex was the dominant lock in the agents
# UI hot path under streaming output. Already a transitive dep via
# gpui/tokio; making it explicit lets us reference it directly.
parking_lot = "0.12"

# TOML reader/writer for the Codex CLI's `~/.codex/config.toml`. Used by the
# composer to mirror the model + reasoning-effort fields into the live pill
# selectors (same bridge pattern as the JSON one for Claude Code's
# `~/.claude/settings.json`).
toml = "0.8"

# Standard deps
anyhow.workspace = true
# EP-001 (prd-cli-agent-orchestration): argument parser for the `paneflow <verb>`
# CLI surface. `Option<Commands>` keeps "no subcommand => launch the GUI" as the
# default; the `mcp`/`--help`/`--version` intercepts stay
# manual and run before clap so it never eats their flags.
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
# Async utilities used by app subsystems that need tokio-compatible futures
# without blocking GPUI's smol event loop.
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
tracing = "0.1"
log.workspace = true
env_logger = "0.11"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
rust-embed = { version = "8.11", features = ["include-exclude"] }
smol = "2.0"
libc = "0.2"
regex = "1"
ctrlc.workspace = true
open = "5"
# Native file picker (markdown "open file" button in the pane tab strip).
# On macOS this is NSOpenPanel, driven via `AsyncFileDialog` from `cx.spawn`.
rfd = "0.17"
# Markdown viewer pane (US-020 - prd-cmux-port-2026-q2.md). CommonMark + tables
# + strikethrough + footnotes via the event API (we walk events directly into
# a GPUI element tree rather than rendering HTML).
pulldown-cmark = { version = "0.10", default-features = false }
# US-014 of tasks/prd-agents-view.md: syntax highlighting for fenced
# code blocks in chat messages. `default-fancy` ships the bundled
# syntax + theme sets plus the FancyRegex engine (~3 MB binary cost,
# acceptable per the PRD's Technical Considerations section).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Multi-worktree diff engine (prd-multi-worktree-diff-2026-Q3.md, EP-002).
# Histogram line-diff lifted from Zed's `buffer_diff::compute_hunks`; pinned to
# the same 0.1.8 Zed uses so the ported algorithm matches the reference API.
imara-diff = "0.1.8"

# Diff syntax highlighting (prd-diff-syntax-highlight-2026-Q3.md). Tree-sitter,
# the same engine Zed uses - fast enough (ms-scale parse) that we highlight at
# build time off-thread, no lazy-viewport machinery needed. Core `tree-sitter`
# 0.26 is already a transitive workspace dep (via the Zed fork); grammars below
# all bridge through `tree-sitter-language` 0.1 (LANGUAGE: LanguageFn, ABI 15,
# accepted by the 0.26 runtime). Each grammar compiles bundled C via `cc`.
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
# Expanded language coverage (prd-diff-syntax-palette-2026-Q3.md, EP-002).
# All bridge through `tree-sitter-language` 0.1 (verified compatible with the
# 0.26 runtime). NOTE: tree-sitter-c / tree-sitter-cpp expose `HIGHLIGHT_QUERY`
# (singular) - every other grammar here uses `HIGHLIGHTS_QUERY` (plural).
# tree-sitter-yaml is the maintained `tree-sitter-grammars` fork (crates.io name
# resolves to it); its highlights query is bundled as a const.
tree-sitter-go = "0.25"   # US-003: P1
tree-sitter-yaml = "0.7"  # US-003: P1
tree-sitter-css = "0.25"  # US-003: P1
tree-sitter-html = "0.23" # US-003: P1
tree-sitter-c = "0.24"    # US-005: P2
tree-sitter-cpp = "0.23"  # US-005: P2
tree-sitter-java = "0.23" # US-005: P2
tree-sitter-ruby = "0.23" # US-005: P2
# QueryCursor::captures returns a StreamingIterator (tree-sitter >= 0.25), not
# a std Iterator.
streaming-iterator = "0.1"
# Re-added as a direct dep: forced per-thread Claude session IDs
# (`claude --session-id <uuid>`) so a live Agents thread maps 1:1 to its
# on-disk session file and can adopt the LLM `ai-title` for its sidebar
# row. `v4` only.
uuid.workspace = true
# Resolve the default shell and agent CLIs on $PATH (`terminal/shell.rs`).
which.workspace = true
# Pinned to the 0.10 stable line (US-006). 0.11 is a pre-release series and
# a direct 0.11 requirement pulls a second copy of `sha2` into the binary
# when any transitive dep resolves 0.10. We only touch the `Sha256` core API
# (`new`/`update`/`finalize`) which is byte-stable across 0.10 ↔ 0.11, so
# the downgrade is compile-clean.
sha2 = "0.10"

# US-008 - atomic rename for extracted AI-hook binaries
# (`src-app/src/ai_hooks/extract.rs`). `NamedTempFile::persist` wraps
# `rename(2)` so the cache-dir publish step is atomic.
tempfile.workspace = true

# Local IPC (US-009). Unix domain sockets; the JSON-RPC newline-delimited
# protocol talks to a local socket path.
interprocess.workspace = true

# Grapheme-cluster boundaries for the cursor-aware TextInput widget
# (widgets/text_input.rs). Already a transitive dep via GPUI, so Cargo
# deduplicates - the direct declaration is only needed to `use` the trait.
unicode-segmentation = "1"

# US-019 (prd-agents-view.md) - composer extensions.
#
# `ignore` is the gitignore-respecting walker used by ripgrep. Powers the
# `@`-mention file completion popup (AC: "recursive, gitignore-respecting,
# debounced 200ms"). Pulled in directly so the agents composer does not have
# to reimplement .gitignore / .ignore / hidden-file filtering by hand.
#
# `base64` encodes image attachments into the ACP `ImageContent.data` field
# (base64 string with a `mime_type` companion). Already a transitive dep
# (rusqlite, ...), so the explicit declaration only adds the public
# surface, not a new compile unit.
ignore = "0.4"
base64 = "0.22"

# Desktop notifications fired by the agents runtime when a turn ends, needs
# input, stalls, or exits unexpectedly while the user is not already looking
# at the Agents panel. `notify-rust` 4.x uses NSUserNotificationCenter.
notify-rust = "4"

# macOS: libproc powers detect_ports() (US-006) - walks per-PID socket FDs
# via proc_pidinfo/proc_pidfdinfo wrappers. The macOS-only gate keeps it
# out of the Linux dep closure entirely.
#
# core-text (US-012) powers the Core-Text-backed monospace enumeration in
# fonts.rs - the macOS path no longer shells out to fc-list (which needs
# Homebrew fontconfig). Already a transitive dep via gpui_macos +
# zed-font-kit, so declaring it direct here adds zero compile units; the
# explicit entry just makes the direct use discoverable.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
core-text = "21"
# core-foundation 0.10 matches the version core-text 21 already pulls (so the
# resolver dedupes and the `TCFType` trait stays coherent across both crates).
# Powers the panic-free Core Text family-name reader in `fonts.rs`.
core-foundation = "0.10"
# Native AppKit material behind the unified sidebar + title bar. GPUI exposes
# its renderer NSView through raw-window-handle; Cocoa/objc let PaneFlow add a
# semantic NSVisualEffectView without carrying macOS APIs into other targets.
raw-window-handle = "0.6"
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "fecc3273ed32643c2ea1b04a74c8780e2c9ffaf8", features = ["test-support", "profiler"] }
tracing-test = "0.2"

# Clippy lint policy (US-007). Mirrors `[workspace.lints.clippy]` in the
# root Cargo.toml EXCEPT the unwrap/expect family is demoted from "warn"
# to "allow" in this crate - src-app has pre-existing calls in GPUI UI code
# where the failure mode is "app crashes" (acceptable for desktop UI) and
# fixing each is out of scope for US-007. New crates (paneflow-ai-hook,
# paneflow-shim, paneflow-config) keep the strict defaults via
# `[lints] workspace = true`.
#
# Follow-up: incremental re-enablement of these three lints in src-app is
# tracked as post-PRD cleanup work. When that lands, remove the `allow`
# overrides below, audit each unwrap site, and re-run `cargo clippy
# --workspace -- -D warnings` to regain the strict gate.
[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "allow"
expect_used = "allow"
unwrap_in_result = "allow"

[lints.rust]
# The `objc` 0.2 `msg_send!` / `sel_impl` macro expands to
# `cfg(feature = "cargo-clippy")` (its old clippy-detection trick). rustc's
# check-cfg flags that as an unexpected `feature` value in this (the
# destination) crate, and a local `#[allow(unexpected_cfgs)]` does NOT silence a
# cfg originating inside an external macro's expansion (rust-lang/rust#124735).
# Declaring the value expected here clears the macOS `cargo clippy` gate (objc
# is macOS-only) while keeping the lint live for our own code.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
